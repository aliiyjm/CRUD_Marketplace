{% extends "base.html" %}
{% block title %}Delete user{% endblock %}
{% block content %}
<h1>Delete user</h1>

<section class="confirm-card" aria-labelledby="confirm-question">
  <p id="confirm-question" class="confirm-question">Are you sure you want to delete this user?</p>
  <dl class="details">
    <dt>ID</dt><dd>{{ user.id }}</dd>
    <dt>Name</dt><dd>{{ user.name }}</dd>
    <dt>Email</dt><dd>{{ user.email }}</dd>
  </dl>
  <p class="warning">This action cannot be undone.</p>
  <form method="post" action="{{ url_for('delete_user', user_id=user.id) }}" class="form-actions">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <a class="btn btn-cancel" href="{{ url_for('index') }}" autofocus>Cancel</a>
    <button type="submit" class="btn btn-confirm-delete">Delete user</button>
  </form>
</section>
{% endblock %}
